[package]
name = "truck_brep"
version = "0.1.0"
edition = "2024"

[dependencies]
# modeling API
truck-modeling = "0.6.0"
# meshing modeled shape
truck-meshalgo = "0.4.0"
# output STEP
truck-stepio = "0.3.0"
# topology helpers (compression)
truck-topology = "0.6.0"
# OBJ parsing
tobj = "4.0"
# glTF serialization
serde_json = "1.0"
